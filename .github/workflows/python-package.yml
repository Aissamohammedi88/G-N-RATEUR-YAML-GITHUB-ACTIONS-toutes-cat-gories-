#
#                    NEXUS PYTHON PACKAGE CI/CD PIPELINE
#         Architecture Constitutionnelle de l'Intégration Continue
#
# ───────────────────────────────────────────────────────────────────────────────
# Auteur      : Aissa Mohammedi (DGK)
# Protocole   : Nametron 3 Lara / ZTMESH v1.5.15
# Version     : 13.0.0
# Description : Pipeline de production exhaustif couvrant le linting,
#               les tests matriciels multi-plateformes, la sécurité (SAST/SCA),
#               le packaging, la publication et le déploiement.
# ───────────────────────────────────────────────────────────────────────────────

name: Python package

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 1 : DÉCLENCHEURS (TRIGGERS)
# Chaque événement est méticuleusement défini pour contrôler l'accès au pipeline.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: 
      - "main"
      - "master"
      - "release/**"
      - "hotfix/**"
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: 
      - "main"
      - "master"
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 0 * * 1' # Tous les lundis à minuit (Audit de sécurité)
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Ignorer les tests (Dangereux)'
        required: false
        type: boolean
        default: false
      environment:
        description: 'Environnement cible'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 2 : PERMISSIONS (PRINCIPE DU MOINDRE PRIVILÈGE)
# On ferme tout par défaut, puis on ouvre chirurgicalement par job.
# ═══════════════════════════════════════════════════════════════════════════════

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write # Nécessaire pour CodeQL

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 3 : CONCURRENCE
# Annule automatiquement les exécutions obsolètes sur la même branche.
# ═══════════════════════════════════════════════════════════════════════════════

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 4 : VARIABLES D'ENVIRONNEMENT GLOBALES
# Centralisation des versions et des paramètres pour tout le pipeline.
# ═══════════════════════════════════════════════════════════════════════════════

env:
  PYTHON_VERSION_DEFAULT: "3.11"
  NODE_VERSION: "20"
  FORCE_COLOR: 3
  PYTHONUNBUFFERED: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  COVERAGE_THRESHOLD: 85

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 5 : JOBS
# L'architecture est divisée en phases logiques.
# ═══════════════════════════════════════════════════════════════════════════════

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 : LINTING & FORMATAGE
  # Vérifie la propreté du code avant même de penser à le tester.
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint & Format"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: 'pip'

      - name: Installation des outils de linting
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 ruff black isort mypy pylint

      - name: Vérification du formatage (Black)
        run: black --check --diff .

      - name: Vérification des imports (isort)
        run: isort --check-only --diff .

      - name: Linting ultra-rapide (Ruff)
        run: ruff check .

      - name: Linting standard (flake8)
        run: |
          # Arrêt sur erreurs critiques (syntaxe, noms non définis)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Avertissements de style sans bloquer
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Vérification des types (Mypy)
        run: mypy . --ignore-missing-imports

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 : TESTS MATRICIELS (Multi-OS & Multi-Python)
  # C'est le cœur du pipeline. On teste sur toutes les plateformes.
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "🧪 Test (${{ matrix.os }} / Py${{ matrix.python-version }})"
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false # Continuer même si une version échoue
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        exclude:
          # Exclure les combinaisons redondantes pour économiser les runners
          - os: macos-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.9"
    
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest pytest-cov pytest-xdist
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Exécution des tests unitaires (avec couverture)
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: |
          pytest -v --cov=. --cov-report=xml --cov-report=term-missing -n auto

      - name: Upload de la couverture vers Codecov (Linux uniquement)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 : SÉCURITÉ (SAST & SCA)
  # On scanne le code et les dépendances pour les vulnérabilités.
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: "🛡️ Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Installation des outils de sécurité
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit

      - name: Scan des vulnérabilités du code (Bandit)
        run: |
          bandit -r . -f custom --msg-template "{abspath}:{line}: {test_id}[{severity}]: {msg}" -x ./tests

      - name: Scan des dépendances (Safety)
        run: |
          safety check || true # Ne bloque pas le pipeline pour l'instant

      - name: Audit des dépendances (pip-audit)
        run: |
          pip-audit -r requirements.txt || true

      - name: Initialisation de CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyse statique profonde (CodeQL)
        uses: github/codeql-action/analyze@v3

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 : AUDIT DU DÉPÔT (NEXUS CUSTOM)
  # Analyse de la structure, des fichiers, et détection de secrets.
  # ─────────────────────────────────────────────────────────────────────────────
  repo_audit:
    name: "🔬 Repo Audit"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Scan de secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Vérification de la structure du projet
        run: |
          echo "Vérification des fichiers essentiels..."
          test -f README.md || (echo "::warning::README.md manquant" && exit 0)
          test -f LICENSE || (echo "::warning::LICENSE manquant" && exit 0)
          test -f requirements.txt || (echo "::warning::requirements.txt manquant" && exit 0)
          test -d .github || (echo "::warning::Dossier .github manquant" && exit 0)
          
      - name: Comptage des lignes de code
        run: |
          echo "Statistiques du code :"
          find . -name "*.py" -not -path "./venv/*" | xargs wc -l | tail -n 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5 : BUILD & PACKAGING
  # Création des artefacts Python (.whl et .tar.gz)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "📦 Build & Package"
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Installation de build
        run: python -m pip install --upgrade build

      - name: Construction du package (Wheel & Sdist)
        run: python -m build

      - name: Vérification des artefacts
        run: |
          ls -la dist/
          python -m pip install twine
          twine check dist/*

      - name: Upload des artefacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 6 : PUBLICATION (TestPyPI & PyPI)
  # Publie le package si un tag de version est créé (ex: v1.0.0)
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: "🚀 Publish to PyPI"
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    permissions:
      id-token: write # IMPORTANT: Obligatoire pour Trusted Publishing
    steps:
      - name: Téléchargement des artefacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publication sur PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Pas besoin de token, on utilise OIDC (Trusted Publishing)

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 7 : NOTIFICATION & RAPPORT FINAL
  # Envoie un résumé dans le Step Summary et alerte en cas d'échec.
  # ─────────────────────────────────────────────────────────────────────────────
  report:
    name: "📋 Final Report"
    runs-on: ubuntu-latest
    needs: [lint, test, security, repo_audit, build]
    if: always()
    steps:
      - name: Génération du rapport de synthèse
        run: |
          echo "### 🧬 NEXUS PIPELINE REPORT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Format | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Matriciels | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Repo Audit | ${{ needs.repo_audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.lint.result }}" == "success" && "${{ needs.test.result }}" == "success" && "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ **Pipeline terminé avec succès. Prêt pour le merge.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Pipeline échoué. Vérifiez les logs ci-dessus.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
      - name: Notification d'échec (Webhook)
        if: failure()      - name: Vérification du formatage (Black)
        run: black --check --diff . || true

      - name: Vérification des imports (isort)
        run: isort --check-only --diff . || true

      - name: Vérification des types (Mypy)
        run: mypy . --ignore-missing-imports || true
        run: |
          echo "::error::Le pipeline a échoué. Alerte envoyée à l'équipe."
          # curl -X POST -H 'Content-type: application/json' --data '{"text":"🚨 Nexus CI a échoué sur la branche ${{ github.ref_name }}"}' ${{ secrets.SLACK_WEBHOOK_URL }}
          
